name: ci

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        run: mvn -B test
      - name: Test output
        if: always()
        run: |
          {
            echo '### Test output'
            echo '```'
            grep -h -E "FULL:|NONE:|RENAME:|S3 FULL:|IOExceptions" target/surefire-reports/*-output.txt target/surefire-reports/*.xml 2>/dev/null | sed 's/<[^>]*>//g' | sort -u || true
            cat target/surefire-reports/*.txt | grep "Tests run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  s3:
    # minio/minio images were pulled from Docker Hub in 2025, so build MinIO from source via the Go module proxy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build and start MinIO (S3 conditional writes)
        run: |
          go install github.com/minio/minio@latest
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=lakehouse MINIO_ROOT_PASSWORD=lakehouse-secret nohup "$(go env GOPATH)/bin/minio" server /tmp/minio-data --address :9000 > minio.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
          "$(go env GOPATH)/bin/minio" --version
      - name: S3 tests
        env:
          LAKEHOUSE_S3_ENDPOINT: http://localhost:9000
          LAKEHOUSE_S3_ACCESS_KEY: lakehouse
          LAKEHOUSE_S3_SECRET_KEY: lakehouse-secret
        run: mvn -B test -Dtest=S3StorageTest
      - name: S3 test output
        if: always()
        run: |
          {
            echo '### S3 (MinIO) test output'
            echo '```'
            cat target/surefire-reports/lakehouse.S3StorageTest.txt || true
            grep -h "S3 FULL" target/surefire-reports/*.xml | sed 's/<[^>]*>//g' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  bench:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Benchmarks + crash test + controls
        run: |
          nproc; lscpu | grep "Model name" || true
          scripts/run-all.sh ci 2>&1 | tee run-all.log
      - name: Summary
        if: always()
        run: cat results/ci/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-ci
          path: |
            results/ci
            run-all.log
